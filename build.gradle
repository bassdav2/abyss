plugins {
    id 'java'
    id 'application'
}

group = 'ch.zhaw.abyss'
version = '0.1.0'

repositories { mavenCentral() }

configurations { formatter }

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

def fxVersion = '26.0.2'
def osName = System.getProperty('os.name').toLowerCase()
def architecture = System.getProperty('os.arch')
def fxPlatform = osName.contains('mac') ? (architecture == 'aarch64' ? 'mac-aarch64' : 'mac') :
                 osName.contains('win') ? 'win' : (architecture == 'aarch64' ? 'linux-aarch64' : 'linux')

dependencies {
    formatter 'com.google.googlejavaformat:google-java-format:1.36.0:all-deps'
    ['base', 'graphics', 'controls', 'media'].each {
        implementation "org.openjfx:javafx-${it}:${fxVersion}:${fxPlatform}"
    }
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'ch.zhaw.abyss.Launcher'
}

sourceSets {
    qa {
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.qa.output
        runtimeClasspath += sourceSets.qa.output
    }
}

tasks.register('renderSoak', JavaExec) {
    classpath = sourceSets.qa.runtimeClasspath
    mainClass = 'ch.zhaw.abyss.qa.RenderSoak'
}

tasks.register('uiSmoke', JavaExec) {
    classpath = sourceSets.qa.runtimeClasspath
    mainClass = 'ch.zhaw.abyss.qa.UiSmoke'
}

tasks.register('renderDemo', JavaExec) {
    classpath = sourceSets.qa.runtimeClasspath
    mainClass = 'ch.zhaw.abyss.qa.RenderDemo'
}

tasks.withType(JavaExec).matching { it.name in ['run', 'renderSoak', 'uiSmoke', 'renderDemo'] }.configureEach {
    if (project.hasProperty('silent')) systemProperty 'abyss.silent', 'true'
    if (project.hasProperty('qaSave')) systemProperty 'abyss.saveDir', project.property('qaSave')
    doFirst {
        def fxJars = classpath.filter { it.name.startsWith('javafx-') }
        def nativeJars = fxJars.filter { it.name.endsWith("-${fxPlatform}.jar") }
        classpath = classpath.minus(fxJars)
        jvmArgs '--module-path', nativeJars.asPath,
                '--add-modules', 'javafx.controls,javafx.media',
                '--enable-native-access=javafx.graphics,javafx.media'
    }
}

['formatJava', 'checkJavaFormat'].each { taskName ->
    tasks.register(taskName, JavaExec) {
        classpath = configurations.formatter
        mainClass = 'com.google.googlejavaformat.java.Main'
        ['api', 'code', 'file', 'parser', 'tree', 'util'].each {
            jvmArgs "--add-exports=jdk.compiler/com.sun.tools.javac.${it}=ALL-UNNAMED"
        }
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        args '--aosp'
        if (taskName == 'formatJava') args '--replace'
        else args '--dry-run', '--set-exit-if-changed'
        args fileTree('src').matching { include '**/*.java' }.files.collect { it.absolutePath }.sort()
    }
}

tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    title = 'ABYSS API · Arbeitsstand 22.09.2026'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all,-serial']
}

test {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped' }
}

tasks.register('copyRuntime', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('runtime-libs')
}

jar {
    manifest { attributes 'Main-Class': application.mainClass.get() }
}
